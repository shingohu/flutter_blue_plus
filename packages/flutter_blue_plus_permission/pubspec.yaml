name: flutter_blue_plus_permission
description: BLE permission helper for flutter_blue_plus.
version: 0.0.1
homepage: https://github.com/shingohu/flutter_blue_plus

environment:
  sdk: ^3.0.0
  flutter: '>=3.7.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.shingo.ble
        pluginClass: BLEPermissionPlugin
      ios:
        pluginClass: BLEPermissionPlugin
      ohos:
        pluginClass: BLEPermissionPlugin
